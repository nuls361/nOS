services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nos
      POSTGRES_USER: nos
      POSTGRES_PASSWORD: nos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nos -d nos"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - nos_postgres:/var/lib/postgresql/data

volumes:
  nos_postgres:
